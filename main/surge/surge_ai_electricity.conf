[General]
# 通用设置
dns-server = 223.5.5.5, 119.29.29.29
ipv6 = false
allow-wifi-access = true
loglevel = notify

[Proxy Group]
# 策略组映射
🌹 Proxy = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=""🌹 Proxy（手动选择）", "🌹 Proxy（负载均衡）""
🌹 Proxy（手动选择） = select, "🇸🇬 新加坡节点", "🇨🇳 台湾节点", "🇯🇵 日本节点", "🇺🇲 美国节点", "🇭🇰 香港节点"
🌹 Proxy（负载均衡） = load-balance, "🇸🇬 新加坡节点（负载均衡）", "🇨🇳 台湾节点（负载均衡）", "🇯🇵 日本节点（负载均衡）", "🇺🇲 美国节点（负载均衡）", "🇭🇰 香港节点（负载均衡）", persistent=0, no-alert=0, hidden=0, include-all-proxies=0

TikTok = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=🌹 Proxy
GitHub = select, interval=600, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=🌹 Proxy
电报信息 = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=🌹 Proxy
Crypto = select, "🇨🇳 台湾节点", no-alert=0, hidden=0, include-all-proxies=0
国外媒体 = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=🌹 Proxy
YouTube = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=🌹 Proxy
微软服务 = select, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=🌹 Proxy
苹果服务 = select, DIRECT, "🇺🇲 美国节点", no-alert=0, hidden=0, include-all-proxies=0
游戏平台 = select, "🌹 Proxy（手动选择）", DIRECT
智能助理 = select, Ai手动选择, no-alert=0, hidden=0, include-all-proxies=0
谷歌服务 = select, Ai手动选择

Ai手动选择 = select, no-alert=0, hidden=0, include-all-proxies=1, include-other-group=✈️ 我的节点
🇭🇰 香港节点 = smart, interval=600, policy-regex-filter=(🇭🇰)|(香港)|(Hong)|(HK), no-alert=0, hidden=1, include-all-proxies=1, include-other-group=✈️ 我的节点
🇺🇲 美国节点 = smart, interval=600, policy-regex-filter=(🇺🇸)|(美国)|(States)|(US), no-alert=0, hidden=1, include-all-proxies=1, include-other-group=✈️ 我的节点
🇯🇵 日本节点 = smart, interval=600, policy-regex-filter=(🇯🇵)|(日本)|(Japan)|(JP), no-alert=0, hidden=1, include-all-proxies=1, include-other-group=✈️ 我的节点
🇨🇳 台湾节点 = smart, interval=600, policy-regex-filter=(🇨🇳)|(台湾)|(Tai)|(TW), no-alert=0, hidden=1, include-all-proxies=1, include-other-group=✈️ 我的节点
🇸🇬 新加坡节点 = smart, interval=600, policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)|(SG), no-alert=0, hidden=1, include-all-proxies=0, include-other-group=✈️ 我的节点

# 负载均衡组
🇺🇲 美国节点（负载均衡） = load-balance, policy-regex-filter=(🇺🇸)|(美国)|(States)|(US), persistent=0, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=✈️ 我的节点
🇭🇰 香港节点（负载均衡） = load-balance, policy-regex-filter=(🇭🇰)|(香港)|(Hong)|(HK), persistent=0, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=✈️ 我的节点
🇯🇵 日本节点（负载均衡） = load-balance, policy-regex-filter=(🇯🇵)|(日本)|(Japan)|(JP), persistent=0, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=✈️ 我的节点
🇨🇳 台湾节点（负载均衡） = load-balance, policy-regex-filter=(🇨🇳)|(台湾)|(Tai)|(TW), persistent=0, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=✈️ 我的节点
🇸🇬 新加坡节点（负载均衡） = load-balance, policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)|(SG), persistent=0, no-alert=0, hidden=1, include-all-proxies=0, include-other-group=✈️ 我的节点

✈️ 我的节点 = select, policy-path=我的代理节点 ,update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Proxy.png

[Rule]
# 规则映射
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Background_Block.list,REJECT
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Backdoor_Block.list,REJECT
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Botnet_Block.list,REJECT
RULE-SET,https://yfamilys.com/rule/TikTok.list,TikTok
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/OpenAI.list,智能助理
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Apple.list,苹果服务
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/GitHub.list,GitHub
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Crypto.list,Crypto
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Microsoft.list,微软服务
RULE-SET,https://raw.githubusercontent.com/ybb963416867/surge_pannel/refs/heads/main/main/rule/Google.list,谷歌服务
RULE-SET,https://raw.githubusercontent.com/Loon0x00/LoonLiteRules/main/proxy/YouTube.list,YouTube
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Telegram.list,电报信息
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/GamePlatforms.list,游戏平台
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/GlobalMedia.list,国外媒体
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Proxy.list,"🌹 Proxy"
FINAL,DIRECT

[Host]
# Egern dns 配置中的 local 映射
localhost = 127.0.0.1

[MITM]
# MITM 配置
skip-server-cert-verify = true
hostname = %APPEND% setup.icloud.com, app-analytics-services.com
ca-passphrase = E8EDF0B7
ca-p12 = 

[Script]
# 脚本映射
日历 = type=http-request,pattern=https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CN_Cal.JS,script-path=https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CN_Cal.JS
