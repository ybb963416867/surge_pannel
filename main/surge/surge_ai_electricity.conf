[General]
# 通用设置
dns-server = 223.5.5.5, 119.29.29.29
ipv6 = false
allow-wifi-access = true
loglevel = notify

[Proxy]
# 请在此处配置您的机场订阅，或使用外部订阅引入
# 格式: 节点名 = custom, host=..., port=... 等，或者使用 Surge 的订阅管理功能

[Proxy Group]
# 策略组映射
🌹 Proxy = select, 🌹 Proxy（负载均衡）, 🌹 Proxy（手动选择）
🌹 Proxy（手动选择） = select, 🇸🇬 新加坡节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇭🇰 香港节点
🌹 Proxy（负载均衡） = load-balance, 🇸🇬 新加坡节点（负载均衡）, 🇨🇳 台湾节点（负载均衡）, 🇯🇵 日本节点（负载均衡）, 🇺🇲 美国节点（负载均衡）, 🇭🇰 香港节点（负载均衡）

TikTok = select, 🌹 Proxy（负载均衡）, 🌹 Proxy（手动选择）
GitHub = url-test, 🌹 Proxy（负载均衡）, 🌹 Proxy（手动选择）, interval=600
电报信息 = select, 🌹 Proxy（负载均衡）, 🌹 Proxy（手动选择）
Crypto = select, 🇨🇳 台湾节点
国外媒体 = select, 🌹 Proxy（手动选择）
YouTube = select, 🌹 Proxy
微软服务 = select, 🌹 Proxy（手动选择）
苹果服务 = select, DIRECT, 🇺🇲 美国节点
游戏平台 = select, 🌹 Proxy（手动选择）, DIRECT
智能助理 = select, Ai手动选择
谷歌服务 = select, Ai手动选择

Ai手动选择 = select, 🇸🇬 新加坡节点, 🇨🇳 台湾节点, 🇯🇵 日本节点, 🇺🇲 美国节点
🇭🇰 香港节点 = url-test, ✈️ 我的节点, interval=600, policy-regex-filter=(🇭🇰)|(香港)|(Hong)|(HK)
🇺🇲 美国节点 = url-test, ✈️ 我的节点, interval=600, policy-regex-filter=(🇺🇸)|(美国)|(States)|(US)
🇯🇵 日本节点 = url-test, ✈️ 我的节点, interval=600, policy-regex-filter=(🇯🇵)|(日本)|(Japan)|(JP)
🇨🇳 台湾节点 = url-test, ✈️ 我的节点, interval=600, policy-regex-filter=(🇨🇳)|(台湾)|(Tai)|(TW)
🇸🇬 新加坡节点 = url-test, ✈️ 我的节点, interval=600, policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)|(SG)

# 负载均衡组
🇺🇲 美国节点（负载均衡） = load-balance, ✈️ 我的节点, policy-regex-filter=(🇺🇸)|(美国)|(States)|(US)
🇭🇰 香港节点（负载均衡） = load-balance, ✈️ 我的节点, policy-regex-filter=(🇭🇰)|(香港)|(Hong)|(HK)
🇯🇵 日本节点（负载均衡） = load-balance, ✈️ 我的节点, policy-regex-filter=(🇯🇵)|(日本)|(Japan)|(JP)
🇨🇳 台湾节点（负载均衡） = load-balance, ✈️ 我的节点, policy-regex-filter=(🇨🇳)|(台湾)|(Tai)|(TW)
🇸🇬 新加坡节点（负载均衡） = load-balance, ✈️ 我的节点, policy-regex-filter=(🇸🇬)|(新加坡)|(Singapore)|(SG)

✈️ 我的节点 = select, policy-path=https://sub.store/download/collection/AllServer?target=Surge

[Rule]
# 规则映射
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Background_Block.list,REJECT
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Backdoor_Block.list,REJECT
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Botnet_Block.list,REJECT
RULE-SET,https://yfamilys.com/rule/TikTok.list,TikTok
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/OpenAI.list,智能助理
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Apple.list,苹果服务
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/GitHub.list,GitHub
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Crypto.list,Crypto
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Microsoft.list,微软服务
RULE-SET,https://raw.githubusercontent.com/ybb963416867/surge_pannel/refs/heads/main/main/rule/Google.list,谷歌服务
RULE-SET,https://raw.githubusercontent.com/Loon0x00/LoonLiteRules/main/proxy/YouTube.list,YouTube
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Telegram.list,电报信息
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/GamePlatforms.list,游戏平台
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/GlobalMedia.list,国外媒体
RULE-SET,https://raw.githubusercontent.com/Thoseyearsbrian/Aegis/main/rules/Proxy.list,🌹 Proxy
FINAL,DIRECT

[Host]
# Egern dns 配置中的 local 映射
localhost = 127.0.0.1

[MITM]
# MITM 配置
ca-p12 = egern.p12
ca-passphrase = egern
hostname = %APPEND% setup.icloud.com, app-analytics-services.com
skip-server-cert-verify = true

[Script]
# 脚本映射
日历 = type=http-request,pattern=https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CN_Cal.JS,script-path=https://raw.githubusercontent.com/IBL3ND/module/refs/heads/main/CN_Cal.JS
